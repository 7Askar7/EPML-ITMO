# Configuration file for Wine Quality ML project

project:
  name: "wine-quality-ml"
  version: "0.1.0"
  author: "ITMO EPML Student"

data:
  raw_data_path: "data/raw/winequality-red.csv"
  processed_data_path: "data/processed"
  test_size: 0.2
  random_state: 42

model:
  type: "RandomForestClassifier"
  parameters:
    n_estimators: 100
    max_depth: 10
    random_state: 42
    n_jobs: -1

training:
  save_model: true
  model_path: "models/wine_quality_model.pkl"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
