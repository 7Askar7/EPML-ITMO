# Pre-commit hooks configuration
# See https://pre-commit.com for more information

exclude: '^data/dvc_remote/'

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        description: Trims trailing whitespace
      - id: end-of-file-fixer
        description: Ensures files end with a newline
      - id: check-yaml
        description: Checks yaml files for parseable syntax
      - id: check-json
        description: Checks json files for parseable syntax
      - id: check-added-large-files
        args: ['--maxkb=1000']
        description: Prevents giant files from being committed
      - id: check-case-conflict
        description: Checks for files with names that would conflict on a case-insensitive filesystem
      - id: check-merge-conflict
        description: Checks for files that contain merge conflict strings
      - id: debug-statements
        description: Checks for debugger imports and breakpoint() calls
      - id: mixed-line-ending
        description: Checks for mixed line endings

  # Black - code formatter
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.11
        description: Formats Python code with Black

  # isort - import sorter
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort
        description: Sorts Python imports with isort

  # Ruff - fast Python linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        description: Runs Ruff linter and fixes issues
      - id: ruff-format
        description: Runs Ruff formatter

  # MyPy - static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - pandas-stubs
        args: [--ignore-missing-imports, --strict]
        description: Runs MyPy type checker

  # Bandit - security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml', '-r', 'src/']
        additional_dependencies: ['bandit[toml]']
        description: Runs Bandit security checker

  # Notebook checks
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-black
        description: Formats Jupyter notebooks with Black
      - id: nbqa-isort
        description: Sorts imports in Jupyter notebooks
      - id: nbqa-ruff
        description: Lints Jupyter notebooks with Ruff

# Run these hooks on all files during the first run
default_language_version:
  python: python3.11
